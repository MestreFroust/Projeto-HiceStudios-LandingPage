<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .catalogo {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }
        .catalogo h2 {
            text-align: center;
            font-size: 2.5rem;
            letter-spacing: 0.12em;
            margin-bottom: 40px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }
        .game-card {
            background: #161616;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        }
        .game-card img {
            width: 100%;
            border-radius: 16px;
            display: block;
            margin-bottom: 16px;
        }
        .game-card a {
            color: #ffffff;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            text-decoration: none;
        }
        .game-card span {
            color: #b1b1b1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="catalogo">
        <section class="category-title-section">
            <h2>CATÁLOGO</h2>
        </section>

        <section class="games-grid">
            <div class="game-card">
                <img src="assets/img/bf4logo.png" alt="Battlefield 4">
                <a>Battlefield 4</a>
                <span>Oct 29, 2013</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bf3.png" alt="Battlefield 3">
                <a>Battlefield 3</a>
                <span>Oct 25, 2011</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bf1.png" alt="Battlefield 1">
                <a>Battlefield 1</a>
                <span>Oct 21, 2016</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bf42.png" alt="Battlefield 2042">
                <a>Battlefield 2042</a>
                <span>Nov 19, 2021</span>
            </div>
            <div class="game-card">
                <img src="assets/img/batt5.webp" alt="Battlefield 5">
                <a>Battlefield 5</a>
                <span>Oct 22, 2018</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bf6.png" alt="Battlefield 6">
                <a>Battlefield 6</a>
                <span>Oct 10, 2025</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bfbad.png" alt="Battlefield Bad Company 2">
                <a>Battlefield Bad Company 2</a>
                <span>Mar 2, 2010</span>
            </div>
            <div class="game-card">
                <img src="assets/img/bf2.png" alt="Battlefield 2">
                <a>Battlefield 2</a>
                <span>Jun 21, 2005</span>
            </div>
        </section>
    </div>
</body>
</html>
